name: Upload release to Thunderstore

# Publishes the release zip asset to Thunderstore with the official Thunderstore
# CLI (github.com/thunderstore-io/thunderstore-cli), installed and run directly.
# Setup (one-off):
#   On GitHub, open Settings -> Secrets and variables -> Actions and create the
#   variables THUNDERSTORE_NAMESPACE ('nickname') and THUNDERSTORE_COMMUNITY
#   ('valheim') and the secret THUNDERSTORE_API_TOKEN (Service Account token
#   from thunderstore.io) that this workflow uses.
#   The variables and the secret may also be defined at the organization level
#   instead of the repository level: if all mods live in the same GitHub
#   organization, defining them once there avoids repeating them for every
#   repository.
#
# The release asset must be a valid Thunderstore package (manifest.json, icon.png,
# README.md, plugins/ at root) — this is what the mod's Release packaging produces.
on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

env:
  ASSET: "AutoAttack.zip"

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        run: |
          missing=0
          if [ -z "${{ vars.THUNDERSTORE_NAMESPACE }}" ]; then
            echo "::error::Repository variable THUNDERSTORE_NAMESPACE is not set (create it in Settings -> Secrets and variables -> Actions)"
            missing=1
          fi
          if [ -z "${{ vars.THUNDERSTORE_COMMUNITY }}" ]; then
            echo "::error::Repository variable THUNDERSTORE_COMMUNITY is not set (create it in Settings -> Secrets and variables -> Actions)"
            missing=1
          fi
          if [ -z "${{ secrets.THUNDERSTORE_API_TOKEN }}" ]; then
            echo "::error::Secret THUNDERSTORE_API_TOKEN is not set (create it in Settings -> Secrets and variables -> Actions)"
            missing=1
          fi
          exit $missing

      - uses: actions/checkout@v4

      - name: Resolve the tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="$INPUT_TAG"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No tag to publish"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Derive the version from the tag
        id: meta
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download the release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release download "$TAG" --pattern "$ASSET" --dir dist
          ls -l dist

      - name: Publish to Thunderstore
        # Publishes with the official Thunderstore CLI instead of a prebuilt action.
        # The config is generated here on purpose: `tcli init` ships default category
        # entries for other communities (e.g. riskofrain2) and the API validates every
        # entry, so we write a minimal thunderstore.toml with our community only.
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.THUNDERSTORE_API_TOKEN }}
          NAMESPACE: ${{ vars.THUNDERSTORE_NAMESPACE }}
          COMMUNITY: ${{ vars.THUNDERSTORE_COMMUNITY }}
          VERSION: ${{ steps.meta.outputs.version }}
          # Category slugs of the community (list: thunderstore.io/api/experimental/community/<community>/category/)
          CATEGORIES: "mods"
        run: |
          set -euo pipefail

          # Install the Thunderstore CLI (releases are marked prerelease, so the asset URL is pinned).
          TCLI_VERSION="0.2.4"
          curl -fsSL -o /tmp/tcli.tar.gz \
            "https://github.com/thunderstore-io/thunderstore-cli/releases/download/${TCLI_VERSION}/tcli-${TCLI_VERSION}-linux-x64.tar.gz"
          tar -xzf /tmp/tcli.tar.gz -C /tmp
          TCLI="/tmp/tcli-${TCLI_VERSION}-linux-x64/tcli"
          chmod +x "$TCLI"

          # Comma-separated slugs -> TOML list ("mods,maps" -> "mods", "maps")
          toml_categories=""
          IFS=',' read -ra CATS <<< "$CATEGORIES"
          for c in "${CATS[@]}"; do
            if [ -n "$toml_categories" ]; then
              toml_categories+=", "
            fi
            toml_categories+="\"$c\""
          done

          # Minimal config: description, dependencies, icon... come from the zip's manifest.json.
          cat > thunderstore.toml <<EOF
          [config]
          schemaVersion = "0.0.1"

          [package]
          namespace = "${NAMESPACE}"
          name = "AutoAttack"
          versionNumber = "${VERSION}"

          [build]
          outdir = "./build"

          [publish]
          repository = "https://thunderstore.io"
          communities = ["${COMMUNITY}"]

          [publish.categories]
          ${COMMUNITY} = [${toml_categories}]
          EOF

          "$TCLI" publish --file "dist/${ASSET}"
