name: Upload to Nexus Mods

# Thin caller: every bit of logic lives in reusable-nexusmods-upload.yml (the
# reusable workflow in orax-modding/publish), fetched at the pinned ref.
# Nothing else to copy from that repo. The changelog sent to Nexus is the body
# of the release being published (git-cliff notes).
# Template: orax-modding/publish README.md section 2.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: read

jobs:
  upload:
    uses: orax-modding/publish/.github/workflows/reusable-nexusmods-upload.yml@v0.1
    with:
      # workflow_dispatch input when run manually, release tag otherwise.
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      mod_id: ${{ vars.NEXUSMODS_MOD_ID }}
      file_id: ${{ vars.NEXUSMODS_FILE_ID }}
      # display_name: <repo-name>.zip    # optional; defaults to <repo-name>.zip
      # update_mod_version: false        # optional; default true
    secrets:
      NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
