name: Upload to Hexium.gg

# Thin caller: every bit of logic lives in reusable-hexium-upload.yml (the
# reusable workflow in orax-modding/publish), fetched at the pinned ref together
# with publish-hexium-thunderstore.py. Nothing else to copy from that repo.
# Template: orax-modding/publish README.md section 1.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: read

jobs:
  upload:
    uses: orax-modding/publish/.github/workflows/reusable-hexium-upload.yml@v0.1
    with:
      # workflow_dispatch input when run manually, release tag otherwise.
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      # Hexium namespace; empty = [package] namespace from hexium.toml.
      # team: ${{ vars.HEXIUM_TEAM }}
      # asset: <repo-name>.zip    # optional; defaults to <repo-name>.zip
      # config: hexium.toml       # optional; defaults to hexium.toml when present
    secrets:
      HEXIUM_API_TOKEN: ${{ secrets.HEXIUM_API_TOKEN }}
